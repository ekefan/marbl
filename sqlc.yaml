version: "2"
sql:
  - engine: "postgresql"
    queries: "infrastructure/postgres/queries/"
    schema:  "infrastructure/postgres/migrations/"
    gen:
      go:
        package:              "generated"
        out:                  "infrastructure/postgres/generated"
        sql_package: "pgx/v5"
        emit_json_tags:       true
        emit_db_tags:         true
        emit_empty_slices:    true
        emit_pointers_for_null_types: true
        emit_prepared_queries: true