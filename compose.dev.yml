services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marbl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marbl}
      POSTGRES_DB: ${POSTGRES_DB:-marbl}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  producer:
    build:
      context: .
      dockerfile: cmd/producer/Dockerfile
      args:
        VERSION: ${VERSION:-v1.0.0}
    restart: unless-stopped
    env_file:
      - .env.dev
    command: ["./producer", "-config", "/app/config.yaml"]
    ports:
      - "9091:9091"
      - "6061:6061"   # pprof
    volumes:
      - ./cmd/producer/config.yaml:/app/config.yaml:ro
    depends_on:
      - postgres
      - rabbitmq

  consumer:
    build:
      context: .
      dockerfile: cmd/consumer/Dockerfile
      args:
        VERSION: ${VERSION:-v1.0.0}
    restart: unless-stopped
    env_file:
      - .env.dev
    command: ["./consumer", "-config", "/app/config.yaml"]
    ports:
      - "9092:9092"
      - "6062:6062"
    volumes:
      - ./cmd/consumer/config.yaml:/app/config.yaml:ro
    depends_on:
      - postgres
      - rabbitmq

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data: