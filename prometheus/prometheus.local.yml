global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "producer"
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: "consumer"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9092"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]