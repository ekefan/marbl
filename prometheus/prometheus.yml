global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "producer"
    static_configs:
      - targets: ["producer:9091"]
    metrics_path: /metrics

  - job_name: "consumer"
    static_configs:
      - targets: ["consumer:9092"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]